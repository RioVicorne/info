<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="75%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sunset Sky -->
  <rect width="600" height="450" fill="url(#skyGrad)"/>
  <circle cx="300" cy="310" r="120" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <circle cx="300" cy="300" r="38" fill="#fffbeb"/>
  <!-- Distant City Silhouettes -->
  <polygon points="40,350 40,240 70,240 70,350" fill="#0f172a" opacity="0.6"/>
  <polygon points="80,350 80,210 120,210 120,350" fill="#0f172a" opacity="0.7"/>
  <polygon points="140,350 140,270 180,270 180,350" fill="#0f172a" opacity="0.65"/>
  <!-- Landmark 81 Tower silhouette -->
  <polygon points="280,350 292,110 298,110 299,60 301,60 302,110 308,110 320,350" fill="#020617"/>
  <polygon points="340,350 340,220 380,220 380,350" fill="#0f172a" opacity="0.8"/>
  <polygon points="400,350 400,260 450,260 450,350" fill="#0f172a" opacity="0.7"/>
  <polygon points="470,350 470,230 520,230 520,350" fill="#0f172a" opacity="0.6"/>
  <!-- Bridge / River Horizon -->
  <rect y="350" width="600" height="100" fill="#090d16"/>
  <!-- Water Light Reflection -->
  <ellipse cx="300" cy="360" rx="90" ry="6" fill="#fb923c" opacity="0.8"/>
  <ellipse cx="300" cy="375" rx="140" ry="8" fill="#f43f5e" opacity="0.6"/>
  <ellipse cx="300" cy="395" rx="180" ry="10" fill="#e11d48" opacity="0.4"/>
  <!-- Badge -->
  <rect x="24" y="390" width="160" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
  <text x="104" y="413" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌇 Saigon Golden Hour</text>
</svg>
