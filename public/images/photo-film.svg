<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="filmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="lensRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="450" fill="url(#filmBg)"/>
  <!-- Film Strip Accent top/bottom -->
  <rect x="0" y="20" width="600" height="35" fill="#0c0a09" stroke="#44403c" stroke-width="1"/>
  <g fill="#292524">
    <rect x="20" y="28" width="18" height="18" rx="2"/><rect x="60" y="28" width="18" height="18" rx="2"/><rect x="100" y="28" width="18" height="18" rx="2"/><rect x="140" y="28" width="18" height="18" rx="2"/><rect x="180" y="28" width="18" height="18" rx="2"/><rect x="220" y="28" width="18" height="18" rx="2"/><rect x="260" y="28" width="18" height="18" rx="2"/><rect x="300" y="28" width="18" height="18" rx="2"/><rect x="340" y="28" width="18" height="18" rx="2"/><rect x="380" y="28" width="18" height="18" rx="2"/><rect x="420" y="28" width="18" height="18" rx="2"/><rect x="460" y="28" width="18" height="18" rx="2"/><rect x="500" y="28" width="18" height="18" rx="2"/><rect x="540" y="28" width="18" height="18" rx="2"/>
  </g>
  <!-- 35mm Camera Body -->
  <rect x="180" y="160" width="240" height="150" rx="16" fill="#1c1917" stroke="#78716c" stroke-width="3"/>
  <rect x="180" y="160" width="240" height="40" rx="10" fill="#a8a29e"/>
  <!-- Shutter Button & Dial -->
  <rect x="210" y="145" width="24" height="15" rx="3" fill="#78716c"/>
  <rect x="360" y="148" width="35" height="12" rx="3" fill="#78716c"/>
  <!-- Viewfinder -->
  <rect x="285" y="140" width="30" height="20" rx="4" fill="#57534e"/>
  <rect x="290" y="145" width="20" height="12" rx="2" fill="#0284c7"/>
  <!-- Leather Texture Area -->
  <rect x="180" y="200" width="240" height="110" fill="#292524"/>
  <!-- Large Camera Lens -->
  <circle cx="300" cy="245" r="65" fill="#44403c" stroke="#a8a29e" stroke-width="4"/>
  <circle cx="300" cy="245" r="50" fill="url(#lensRing)"/>
  <circle cx="288" cy="232" r="14" fill="#ffffff" opacity="0.4"/>
  <!-- Red dot Leica-style accent -->
  <circle cx="225" cy="180" r="8" fill="#ef4444"/>
  <!-- Badge -->
  <rect x="24" y="390" width="160" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
  <text x="104" y="413" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">📷 35mm Street Film</text>
</svg>
