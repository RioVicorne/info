<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="warmCafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1f18"/>
      <stop offset="50%" stop-color="#4a3328"/>
      <stop offset="100%" stop-color="#1f140e"/>
    </linearGradient>
    <radialGradient id="cupLight" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d4a373" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#bc6c25" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3d2314" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background table -->
  <rect width="600" height="450" fill="url(#warmCafe)"/>
  <rect width="600" height="450" fill="#000000" opacity="0.15"/>
  <!-- Coffee Saucer -->
  <ellipse cx="300" cy="270" rx="140" ry="70" fill="#1b120c" stroke="#5c4033" stroke-width="3"/>
  <ellipse cx="300" cy="265" rx="125" ry="60" fill="#2a1d15"/>
  <!-- Coffee Cup -->
  <ellipse cx="300" cy="230" rx="95" ry="55" fill="url(#cupLight)"/>
  <ellipse cx="300" cy="225" rx="85" ry="48" fill="#582f0e"/>
  <!-- Latte Art Foam -->
  <ellipse cx="300" cy="225" rx="78" ry="42" fill="#ddb892"/>
  <path d="M 300 200 C 275 215, 275 235, 300 248 C 325 235, 325 215, 300 200 Z" fill="#fff1e6" opacity="0.9"/>
  <circle cx="300" cy="210" r="10" fill="#fff1e6"/>
  <!-- Steam lines -->
  <path d="M 280 190 Q 270 140 285 100" stroke="url(#steamGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 310 185 Q 325 135 305 95" stroke="url(#steamGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Text Label Badge -->
  <rect x="24" y="390" width="160" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
  <text x="104" y="413" fill="#fefae0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">☕ Saigon Drip Coffee</text>
</svg>
