<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="roomLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="monitorGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Room Wall -->
  <rect width="600" height="450" fill="url(#roomLight)"/>
  <!-- Ambient screen glow on wall -->
  <circle cx="300" cy="180" r="160" fill="url(#monitorGlow)"/>
  <!-- Desk surface -->
  <rect y="290" width="600" height="160" fill="#181e29"/>
  <line x1="0" y1="290" x2="600" y2="290" stroke="#334155" stroke-width="2"/>
  <!-- Desk Mat -->
  <rect x="120" y="310" width="360" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Monitor Stand & Screen -->
  <rect x="290" y="240" width="20" height="60" fill="#475569"/>
  <rect x="260" y="295" width="80" height="8" rx="4" fill="#334155"/>
  <rect x="160" y="70" width="280" height="175" rx="8" fill="#090d16" stroke="#475569" stroke-width="3"/>
  <!-- Screen code editor mockup -->
  <rect x="168" y="78" width="264" height="159" rx="4" fill="#0d1117"/>
  <circle cx="180" cy="90" r="4" fill="#f87171"/>
  <circle cx="192" cy="90" r="4" fill="#fbbf24"/>
  <circle cx="204" cy="90" r="4" fill="#34d399"/>
  <!-- Code lines on monitor -->
  <rect x="180" y="105" width="100" height="6" rx="3" fill="#38bdf8"/>
  <rect x="195" y="118" width="80" height="5" rx="2" fill="#c084fc"/>
  <rect x="195" y="129" width="120" height="5" rx="2" fill="#94a3b8"/>
  <rect x="180" y="142" width="60" height="5" rx="2" fill="#34d399"/>
  <rect x="180" y="155" width="90" height="5" rx="2" fill="#f472b6"/>
  <!-- Mechanical Keyboard -->
  <rect x="210" y="335" width="180" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <g fill="#475569">
    <rect x="220" y="342" width="12" height="10" rx="2"/><rect x="236" y="342" width="12" height="10" rx="2"/><rect x="252" y="342" width="12" height="10" rx="2"/><rect x="268" y="342" width="12" height="10" rx="2"/><rect x="284" y="342" width="12" height="10" rx="2"/><rect x="300" y="342" width="12" height="10" rx="2"/><rect x="316" y="342" width="12" height="10" rx="2"/><rect x="332" y="342" width="12" height="10" rx="2"/><rect x="348" y="342" width="12" height="10" rx="2"/><rect x="364" y="342" width="16" height="10" rx="2"/>
    <rect x="220" y="356" width="14" height="10" rx="2"/><rect x="238" y="356" width="12" height="10" rx="2"/><rect x="254" y="356" width="12" height="10" rx="2"/><rect x="270" y="356" width="12" height="10" rx="2"/><rect x="286" y="356" width="12" height="10" rx="2"/><rect x="302" y="356" width="12" height="10" rx="2"/><rect x="318" y="356" width="12" height="10" rx="2"/><rect x="334" y="356" width="12" height="10" rx="2"/><rect x="350" y="356" width="30" height="10" rx="2" fill="#38bdf8"/>
    <rect x="250" y="384" width="90" height="10" rx="3" fill="#cbd5e1"/>
  </g>
  <!-- Mouse -->
  <rect x="420" y="345" width="28" height="42" rx="14" fill="#334155" stroke="#475569"/>
  <!-- Mini Succulent Plant -->
  <ellipse cx="90" cy="305" rx="18" ry="6" fill="#111827"/>
  <path d="M 80 305 L 82 325 L 98 325 L 100 305 Z" fill="#9a3412"/>
  <circle cx="87" cy="298" r="8" fill="#10b981"/>
  <circle cx="94" cy="296" r="9" fill="#059669"/>
  <circle cx="90" cy="290" r="8" fill="#34d399"/>
  <!-- Badge -->
  <rect x="24" y="390" width="160" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
  <text x="104" y="413" fill="#fff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">💻 Late Night Workspace</text>
</svg>
